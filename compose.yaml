# Local development only; not the central service deployment.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postonce
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: postonce
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postonce_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postonce -d postonce"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postonce_pg:
